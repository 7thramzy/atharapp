name: athaar
description: An offline-first Islamic learning and community application.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  sherpa_onnx: ^2.0.3
  record: ^7.2.0
  url_launcher: ^6.3.3

  # Used to decompress page-scoped QCF fonts in the browser without path_provider.
  archive: ^4.0.9

  # Hafs Mushaf renderer; public asset redistribution remains a separate release gate.
  qcf_quran_plus: 0.1.1

  # State and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local-first persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Localization and formatting
  intl: ^0.20.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/quran/tanzil-uthmani-v1.1.json
