name: athaar
description: An offline-first Islamic learning and community application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local-first persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Localization and formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true
