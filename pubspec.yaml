name: athaar
description: An offline-first Islamic learning and community application.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.4
  url_launcher: ^6.3.3
  path_provider: ^2.1.6

  # Used to decompress page-scoped QCF fonts in the browser without path_provider.
  archive: ^4.0.9

  # Hafs Mushaf renderer; public asset redistribution remains a separate release gate.
  qcf_quran_plus: 0.1.1

  # State and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local-first persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Localization and formatting
  intl: ^0.20.3
  crypto: ^3.0.8
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  flutter_local_notifications: ^23.0.4
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/quran/tanzil-uthmani-v1.1.json
    - assets/content/adhkar/seed-v1.json
