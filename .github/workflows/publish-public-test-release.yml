name: Rebuild and publish verified Android test APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-public-test-release.yml
      - pubspec.yaml
      - lib/**
      - assets/content/quran/**
      - android/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: athaar-android-test-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire official Quran source
        run: |
          python tooling/content/quran/download_source.py
          python tooling/content/quran/build_dataset.py
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile folders if needed
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies and generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build universal Android release APK
        run: flutter build apk --release

      - name: Verify APK structure, alignment, manifest and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.athaar.athaar'" apk-badging.txt
          grep -q "native-code:.*arm64-v8a" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare public release assets
        run: |
          mkdir -p public-release
          cp build/app/outputs/flutter-apk/app-release.apk public-release/Athaar-0.2.1-android-test.apk
          cp apk-sha256.txt public-release/SHA256SUMS.txt

      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(cut -d ' ' -f1 apk-sha256.txt)"
          gh release create v0.2.1-test \
            public-release/Athaar-0.2.1-android-test.apk \
            public-release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Athaar 0.2.1 — Android Device Test" \
            --prerelease \
            --notes "Fresh universal Flutter release APK for device testing. Includes ARM64 native code. APK structure, zip alignment, package ID and Android signing were checked in CI. Test/debug signing only; not for Google Play production. SHA-256: ${SHA}"
