name: Windows production signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Validate and import code-signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Production Windows signing secrets are missing."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "athaar-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfxPath,
            $env:WINDOWS_SIGNING_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if (!$cert.HasPrivateKey) { throw "The PFX does not contain a private key." }
          if (!(($cert.EnhancedKeyUsageList | ForEach-Object {$_.ObjectId.Value}) -contains "1.3.6.1.5.5.7.3.3")) {
            throw "The certificate does not contain the code-signing EKU."
          }
          "ATHAAR_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve and generate
        run: |
          flutter pub get
          dart run build_runner build

      - name: Run product tests
        run: |
          flutter analyze --fatal-infos
          flutter test test/core/database --reporter expanded --timeout 60s
          flutter test test/app/athaar_app_test.dart --reporter expanded --timeout 60s
          flutter test test/quran --reporter expanded --timeout 90s
          flutter test test/quran_study --reporter expanded --timeout 90s

      - name: Build Windows application
        run: flutter build windows --release

      - name: Prepare installer dependencies
        shell: pwsh
        run: |
          $supportDir = Join-Path $PWD "build/windows/installer-support"
          $installerDir = Join-Path $PWD "build/windows/installer"
          New-Item -ItemType Directory -Force -Path $supportDir | Out-Null
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          $redist = Join-Path $supportDir "vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $redist
          if (!(Test-Path $redist) -or (Get-Item $redist).Length -lt 1000000) {
            throw "Microsoft Visual C++ Redistributable download is missing or incomplete."
          }
          choco install innosetup --yes --no-progress

      - name: Package installer
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $installerDir = Join-Path $PWD "build/windows/installer"
          $redistPath = (Resolve-Path "build/windows/installer-support/vc_redist.x64.exe").Path
          $env:ATHAAR_BUILD_DIR = $releaseDir
          $env:ATHAAR_INSTALLER_DIR = $installerDir
          $env:ATHAAR_VC_REDIST = $redistPath
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          & $iscc "/DAppVersion=0.3.0" "tooling/windows/Athaar.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = Join-Path $installerDir "Athaar-Setup-0.3.0.exe"
          if (!(Test-Path $installer)) { throw "Windows installer was not created." }

      - name: Sign application and installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$signtool) { throw "Windows SDK signtool.exe was not found." }
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $installerDir = (Resolve-Path "build/windows/installer").Path
          $targets = @(
            (Join-Path $releaseDir "athaar.exe"),
            (Join-Path $installerDir "Athaar-Setup-0.3.0.exe")
          )
          foreach ($target in $targets) {
            if (!(Test-Path $target)) { throw "Missing expected signing target: $target" }
            & $signtool sign /fd SHA256 /f $env:ATHAAR_PFX_PATH /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $target" }
            & $signtool verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $target" }
          }
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath (Join-Path $installerDir "Athaar-Windows-Portable-0.3.0.zip") -Force

      - name: Upload signed Windows files
        uses: actions/upload-artifact@v4
        with:
          name: athaar-windows-production-signed
          path: |
            build/windows/installer/Athaar-Setup-0.3.0.exe
            build/windows/installer/Athaar-Windows-Portable-0.3.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:ATHAAR_PFX_PATH -and (Test-Path $env:ATHAAR_PFX_PATH)) {
            Remove-Item -Force $env:ATHAAR_PFX_PATH
          }
