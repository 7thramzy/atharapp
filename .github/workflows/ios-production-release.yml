name: iOS production signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ipa:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      KEYCHAIN_PATH: ${{ runner.temp }}/athaar-signing.keychain-db

    steps:
      - uses: actions/checkout@v4

      - name: Validate and import Apple signing assets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_BUNDLE_ID"
          test -n "$IOS_PROVISIONING_PROFILE_NAME"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$IOS_KEYCHAIN_PASSWORD"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          grep -F "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj

          CERT_PATH="$RUNNER_TEMP/athaar-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/athaar-appstore.mobileprovision"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile-decoded.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile-decoded.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$IOS_BUNDLE_ID</key><string>$IOS_PROVISIONING_PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve and generate
        run: |
          flutter pub get
          dart run build_runner build

      - name: Run release acceptance tests
        run: |
          flutter analyze --fatal-infos
          flutter test test/core/database --reporter expanded --timeout 60s
          flutter test test/app/athaar_app_test.dart --reporter expanded --timeout 60s
          flutter test test/quran --reporter expanded --timeout 90s
          flutter test test/quran_study --reporter expanded --timeout 90s

      - name: Install iOS CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install
          cd ..

      - name: Archive iOS application with Apple Distribution identity
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Athaar.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            archive

      - name: Export signed App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Athaar.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p build/ios/ipa
          cp "$RUNNER_TEMP/ipa"/*.ipa build/ios/ipa/

      - name: Verify signed IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          test -s "$IPA"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP="$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -F "TeamIdentifier=$IOS_TEAM_ID"
          security cms -D -i "$APP/embedded.mobileprovision" >/dev/null
          shasum -a 256 "$IPA"

      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: athaar-ios-production-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Apple signing assets
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/athaar-distribution.p12"
          rm -f "$RUNNER_TEMP/athaar-appstore.mobileprovision"
          rm -f "$RUNNER_TEMP/profile-decoded.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
