name: Flutter CI

on:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athaar-flutter-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      # Format in the runner workspace, then upload the formatted source snapshot.
      # The coordinator commits this exact formatter output before the final CI run.
      - name: Apply Dart formatting
        run: dart format lib test

      - name: Upload formatted Dart source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: athaar-formatted-dart-source
          path: |
            lib/
            test/
            pubspec.lock
            android/
            ios/
            .metadata
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Drift database tests
        run: flutter test test/core/database/app_database_test.dart --reporter expanded --timeout 60s

      - name: Widget tests
        run: flutter test test/app/athaar_app_test.dart --reporter expanded --timeout 60s

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Android APK
        run: flutter build apk --debug

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign

  finalize-generated-sources:
    name: Commit generated platform and formatted source
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
    needs:
      - quality
      - android-build
      - ios-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download formatted source and generated files
        uses: actions/download-artifact@v4
        with:
          name: athaar-formatted-dart-source
          path: .athaar-ci-artifact

      - name: Commit formatted source, dependency lockfile and native projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -f .athaar-ci-artifact/pubspec.lock
          cp .athaar-ci-artifact/pubspec.lock pubspec.lock

          for directory in lib test android ios; do
            if [[ -d ".athaar-ci-artifact/${directory}" ]]; then
              mkdir -p "${directory}"
              cp -a ".athaar-ci-artifact/${directory}/." "${directory}/"
            fi
          done

          if [[ -f .athaar-ci-artifact/.metadata ]]; then
            cp .athaar-ci-artifact/.metadata .metadata
          fi

          rm -f android/local.properties
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral

          git add pubspec.lock .metadata lib test android ios
          if git diff --cached --quiet; then
            echo "No generated or formatted files need committing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit formatted source and generated mobile projects"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/flutter-ci.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
