name: Flutter CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athaar-flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      # Format in the runner workspace, then upload the formatted source snapshot.
      # The coordinator commits this exact formatter output before the final CI run.
      - name: Apply Dart formatting
        run: dart format lib test

      - name: Upload formatted Dart source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: athaar-formatted-dart-source
          path: |
            lib/
            test/
          if-no-files-found: error
          retention-days: 1

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Android APK
        run: flutter build apk --debug

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
