name: Flutter CI
# CI builds and validates the browser preview; the linked Vercel project handles deployment.

on:
  push:
    branches:
      - main
      - "agent/**"
      - "design/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athaar-flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  ATHAAR_VERSION: "0.2.0"

jobs:
  acquire-quran-source:
    name: Acquire official Tanzil Uthmani v1.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and fingerprint official source
        run: python tooling/content/quran/download_source.py
      - name: Build and validate deterministic offline import JSON
        run: python tooling/content/quran/build_dataset.py
      - name: Upload verbatim source, metadata, and import payload
        uses: actions/upload-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Format, analyze and test
    needs: acquire-quran-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Quran dataset for build
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage bundled Quran asset
        shell: bash
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Generate Windows desktop project folder
        run: flutter create --no-pub --project-name athaar --platforms=windows .

      - name: Generate platform application icons
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --disable-pip-version-check cairosvg pillow
          python tooling/icons/generate_icons.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Report QCF package font footprint
        run: python tooling/quran/report_qcf_package_footprint.py

      - name: Generate Drift code
        run: dart run build_runner build

      # Format in the runner workspace, then upload the formatted source snapshot.
      # The coordinator commits this exact formatter output before the final CI run.
      - name: Apply Dart formatting
        run: dart format lib test

      - name: Upload formatted Dart source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: athaar-formatted-dart-source
          path: |
            lib/
            test/
            pubspec.lock
            android/
            ios/
            windows/
            .metadata
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Drift database tests
        run: flutter test test/core/database --reporter expanded --timeout 60s

      - name: Widget tests
        run: flutter test test/app/athaar_app_test.dart --reporter expanded --timeout 60s

      - name: QCF reader and adapter tests
        run: flutter test test/quran --reporter expanded --timeout 60s
      - name: Local Quran audio-evaluation metric tests
        run: python -m unittest discover -s tooling/audio_evaluation -p 'test_*.py' -v

  android-build:
    name: Android debug and test-release builds
    runs-on: ubuntu-latest
    needs: [quality, acquire-quran-source]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Quran dataset for build
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage bundled Quran asset
        shell: bash
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Install pinned Android NDK (retry transient SDK downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          installed=0
          for attempt in 1 2 3; do
            echo "Installing Android NDK 28.2.13676358 (attempt $attempt/3)"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358"; then
              installed=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "NDK download did not complete; retrying after a short delay."
              sleep $((attempt * 15))
            fi
          done

          if [[ "$installed" -ne 1 || ! -f "$SDK_ROOT/ndk/28.2.13676358/source.properties" ]]; then
            echo "Android NDK 28.2.13676358 was not installed successfully." >&2
            exit 1
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Record Android debug APK size
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          stat --printf="ATHAAR_ANDROID_DEBUG_APK_BYTES=%s\\n" "$APK"

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: athaar-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build arm64 test-release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify INTERNET permission in merged Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find build/app/intermediates -type f -name AndroidManifest.xml | grep -E '/merged_manifests?/release/' | head -n 1 || true)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Merged Android release manifest was not found." >&2
            find build/app/intermediates -type f -name AndroidManifest.xml -print >&2
            exit 1
          fi
          grep -F 'android.permission.INTERNET' "$MANIFEST"

      - name: Verify Android arm64 test-release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Record Android arm64 test-release APK size and checksum
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          stat --printf="ATHAAR_ANDROID_ARM64_TEST_RELEASE_APK_BYTES=%s\\n" "$APK"
          sha256sum "$APK"

      - name: Upload Android arm64 test-release APK
        uses: actions/upload-artifact@v4
        with:
          name: athaar-android-arm64-test-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


  android-production-release:
    name: Signed Android production release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, acquire-quran-source]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
      - name: Download official Quran source
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage Quran source
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Android project and code
        run: |
          bash tooling/bootstrap_mobile_platforms.sh
          flutter pub get
          dart run build_runner build
      - name: Configure protected Android upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build production Android App Bundle and universal APK
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify production signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          test -s "$AAB"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$APK" "$AAB"
      - name: Upload signed Android production outputs
        uses: actions/upload-artifact@v4
        with:
          name: athaar-android-production-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    needs: [quality, acquire-quran-source]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Quran dataset for build
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage bundled Quran asset
        shell: bash
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native mobile project folders
        run: bash tooling/bootstrap_mobile_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign

  windows-build:
    name: Windows release and installer
    runs-on: windows-2022
    needs: [quality, acquire-quran-source]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Quran dataset for build
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage bundled Quran asset
        shell: bash
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Windows desktop project folder
        run: flutter create --no-pub --project-name athaar --platforms=windows .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Windows release
        run: flutter build windows --release

      - name: Prepare Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $supportDir = Join-Path $PWD "build/windows/installer-support"
          New-Item -ItemType Directory -Force -Path $supportDir | Out-Null
          $redist = Join-Path $supportDir "vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $redist
          if (!(Test-Path $redist) -or (Get-Item $redist).Length -lt 1000000) {
            throw "Microsoft Visual C++ Redistributable download is missing or incomplete."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer and portable build
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $installerDir = Join-Path $PWD "build/windows/installer"
          $redistPath = (Resolve-Path "build/windows/installer-support/vc_redist.x64.exe").Path
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

          $env:ATHAAR_BUILD_DIR = $releaseDir
          $env:ATHAAR_INSTALLER_DIR = $installerDir
          $env:ATHAAR_VC_REDIST = $redistPath

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }

          & $iscc "/DAppVersion=${{ env.ATHAAR_VERSION }}" "tooling/windows/Athaar.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $exe = Join-Path $releaseDir "athaar.exe"
          if (!(Test-Path $exe)) {
            throw "Expected app executable was not found: $exe"
          }

          $isTaggedRelease = $env:GITHUB_REF -like "refs/tags/v*"
          $pfxPath = Join-Path $PWD "build/windows/installer-support/athaar-signing.pfx"
          if ($isTaggedRelease) {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
                [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
              throw "Tagged Windows release requires WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD secrets."
            }
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtoolCommand) {
              $signtoolPath = $signtoolCommand.Source
            } else {
              $signtoolFile = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction Stop |
                Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (!$signtoolFile) {
                throw "Windows SDK signtool.exe was not found."
              }
              $signtoolPath = $signtoolFile.FullName
            }
            & $signtoolPath sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $exe
            if ($LASTEXITCODE -ne 0) {
              throw "Signing the Athaar application executable failed."
            }
            & $signtoolPath verify /pa $exe
            if ($LASTEXITCODE -ne 0) {
              throw "The Athaar application executable signature did not verify."
            }
          }

          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath (Join-Path $installerDir "Athaar-Windows-Portable-${{ env.ATHAAR_VERSION }}.zip") -CompressionLevel Optimal -Force

          $setupExe = Join-Path $installerDir "Athaar-Setup-${{ env.ATHAAR_VERSION }}.exe"
          if (!(Test-Path $setupExe)) {
            throw "Windows installer was not created."
          }

          if ($isTaggedRelease) {
            & $signtoolPath sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $setupExe
            if ($LASTEXITCODE -ne 0) {
              throw "Signing the Athaar Windows installer failed."
            }
            & $signtoolPath verify /pa $setupExe
            if ($LASTEXITCODE -ne 0) {
              throw "The Athaar Windows installer signature did not verify."
            }
            Remove-Item -Force $pfxPath
          }

      - name: Upload Windows installer and portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: athaar-windows-installers
          path: |
            build/windows/installer/Athaar-Setup-${{ env.ATHAAR_VERSION }}.exe
            build/windows/installer/Athaar-Windows-Portable-${{ env.ATHAAR_VERSION }}.zip
          if-no-files-found: error
          retention-days: 14

  ios-production-release:
    name: Signed iOS App Store IPA
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, acquire-quran-source]
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
      - name: Download official Quran source
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition
      - name: Stage Quran source
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate iOS project and code
        run: |
          bash tooling/bootstrap_mobile_platforms.sh
          flutter pub get
          dart run build_runner build
          flutter build ios --release --no-codesign
      - name: Import Apple distribution certificate and provisioning profile
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_P12_BASE64:?Missing IOS_DISTRIBUTION_P12_BASE64 secret}"
          : "${IOS_DISTRIBUTION_P12_PASSWORD:?Missing IOS_DISTRIBUTION_P12_PASSWORD secret}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Missing IOS_PROVISIONING_PROFILE_BASE64 secret}"
          : "${IOS_TEAM_ID:?Missing IOS_TEAM_ID secret}"
          KEYCHAIN_PATH="$RUNNER_TEMP/athaar-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/athaar-distribution.p12"
          security import "$RUNNER_TEMP/athaar-distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          PROFILE_PATH="$RUNNER_TEMP/athaar-appstore.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/athaar-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/athaar-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/athaar-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          cat > build/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.athaar.athaar</key><string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Athaar.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Athaar.xcarchive" \
            -exportOptionsPlist "$PWD/build/ios/ExportOptions.plist" \
            -exportPath "$PWD/build/ios/ipa"
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          shasum -a 256 "$IPA"
      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: athaar-ios-production-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

  finalize-generated-sources:
    name: Commit generated platform and formatted source
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/agent/') || github.ref == 'refs/heads/main')
    needs:
      - quality
      - android-build
      - ios-build
      - windows-build
      - acquire-quran-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download formatted source and generated files
        uses: actions/download-artifact@v4
        with:
          name: athaar-formatted-dart-source
          path: .athaar-ci-artifact

      - name: Download official Quran source and generated import payload
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: .athaar-quran-artifact

      - name: Commit formatted source, dependency lockfile and native projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin "${GITHUB_REF_NAME}"
          REMOTE_HEAD="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${REMOTE_HEAD}" != "${GITHUB_SHA}" ]]; then
            echo "Skipping stale CI artifact commit: branch head moved from ${GITHUB_SHA} to ${REMOTE_HEAD}."
            exit 0
          fi

          test -f .athaar-ci-artifact/pubspec.lock
          cp .athaar-ci-artifact/pubspec.lock pubspec.lock

          for directory in lib test android ios windows; do
            if [[ -d ".athaar-ci-artifact/${directory}" ]]; then
              mkdir -p "${directory}"
              cp -a ".athaar-ci-artifact/${directory}/." "${directory}/"
            fi
          done

          if [[ -f .athaar-ci-artifact/.metadata ]]; then
            cp .athaar-ci-artifact/.metadata .metadata
          fi

          mkdir -p assets/content/quran/source
          cp .athaar-quran-artifact/quran-uthmani-v1.1.txt assets/content/quran/source/
          cp .athaar-quran-artifact/quran-data.xml assets/content/quran/source/
          cp .athaar-quran-artifact/source-manifest.json assets/content/quran/source/
          cp .athaar-quran-artifact/tanzil-uthmani-v1.1.json assets/content/quran/

          rm -f android/local.properties
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral
          rm -rf windows/flutter/ephemeral

          git add pubspec.lock .metadata lib test android ios windows assets/content/quran
          if git diff --cached --quiet; then
            echo "No generated or formatted files need committing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit formatted source and generated platform projects"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/flutter-ci.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

  web-preview:
    name: Build browser preview artifact
    needs: [quality, acquire-quran-source]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design/match-athaar-reference' || github.ref == 'refs/heads/design/quran-study-multimedia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Quran dataset
        uses: actions/download-artifact@v4
        with:
          name: athaar-tanzil-uthmani-v1.1-source
          path: build/tanzil-acquisition

      - name: Stage Quran asset
        run: |
          mkdir -p assets/content/quran
          cp build/tanzil-acquisition/tanzil-uthmani-v1.1.json assets/content/quran/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate web platform
        run: flutter create --no-pub --project-name athaar --org com.athaar --platforms=web .

      - name: Resolve dependencies and generate database code
        run: |
          flutter pub get
          dart run build_runner build

      - name: Download matching Drift browser runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          curl --fail --location --retry 3 \
            https://github.com/simolus3/drift/releases/download/drift-2.35.4/sqlite3.wasm \
            --output web/sqlite3.wasm
          curl --fail --location --retry 3 \
            https://github.com/simolus3/drift/releases/download/drift-2.35.4/drift_worker.js \
            --output web/drift_worker.js
          echo "e7451780e78c56ff864fe9317a0fbcd6aeb2e8de3beba7f5efd963202f7ec3d9  web/sqlite3.wasm" | sha256sum --check
          echo "48c950cd8e3bc3cddb34816c860e228be8832bef07a297c27e9907c057ff8162  web/drift_worker.js" | sha256sum --check

      - name: Build browser preview
        run: flutter build web --release --base-href "/"

      - name: Verify browser runtime files
        run: |
          test -s build/web/index.html
          test -s build/web/sqlite3.wasm
          test -s build/web/drift_worker.js
          grep -F '<base href="/">' build/web/index.html

      - name: Upload browser preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: athaar-browser-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14
